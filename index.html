<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Tracker</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>❄️ Winter Arc Comeback</h1>
            <p class="subtitle">Daily Security & AI Tracker</p>
        </header>

        <!-- Winter Arc End Date Picker -->
        <section class="date-picker-section">
            <label for="arc-end-date">Set Your Winter Arc End Date:</label>
            <input type="date" id="arc-end-date">
        </section>

        <!-- Daily Stats Dashboard -->
        <section class="dashboard">
            <div class="stat-box">
                <span class="stat-label">Current Streak</span>
                <span class="stat-value" id="streak-count">🔥 0 Days</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Total Time</span>
                <span class="stat-value" id="total-time">0 hrs</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Overall Progress</span>
                <span class="stat-value" id="progress-percentage">0%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Days Left</span>
                <span class="stat-value" id="days-left">0 Days</span>
            </div>
        </section>

        <!-- Pomodoro Timer -->
        <section class="pomodoro-section">
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-controls">
                <button id="timer-start-btn" class="timer-btn start">▶ Start</button>
                <button id="timer-reset-btn" class="timer-btn reset">↺ Reset</button>
            </div>
        </section>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="reset-btn" class="reset-btn">🔄 Reset All Progress</button>
            <button id="undo-btn" class="undo-btn">↩ Undo Last Task</button>
            <button id="export-btn" class="undo-btn" style="background: #0ea5e9; color: white; border-color: #0ea5e9;">💾 Backup Data</button>
        </div>

        <!-- Daily Check-in Form -->
        <section class="daily-log">
            <h3>Log Today's Session</h3>
            <div class="quick-add-grid">
                <button class="quick-add-btn" data-minutes="15">+15m</button>
                <button class="quick-add-btn" data-minutes="30">+30m</button>
                <button class="quick-add-btn" data-minutes="45">+45m</button>
                <button class="quick-add-btn" data-minutes="60">+1h</button>
            </div>
            <textarea id="daily-notes" placeholder="Quick notes on what you learned today..."></textarea>
        </section>

        <main id="tracker-container" class="tracker-list">
            <!-- Topics will be injected here by app.js -->
        </main>

    </div>
    <script src="app.js"></script>
</body>
</html>
